name: Aggregate live locations

# The "server" of MoveWorld's GitHub-hosted live backend.
#
#   app  --PUT-->  data/pings/<device_id>.json   (one file per device)
#   this workflow -> data/locations.json         (the read model apps poll)
#
# Runs whenever a ping lands (push touching data/pings/**) and every 15
# minutes to sweep expired presence. Superseded runs are cancelled so the
# aggregate stays fresh at the cost of one short run.

on:
  push:
    branches: [main]
    paths: ['data/pings/**']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: aggregate
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aggregate:
    name: Merge pings, prune expired presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregator self-test
        run: python3 scripts/aggregate.py --selftest

      - name: Aggregate pings into data/locations.json
        run: python3 scripts/aggregate.py

      # Commits made with the workflow's GITHUB_TOKEN do not trigger new
      # workflow runs, so this push cannot loop — and the `paths` filter
      # above already excludes data/locations.json itself.
      - name: Commit and push (only when something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit needed."
          else
            git commit -m "chore: aggregate live locations [skip ci]"
            git push
          fi
